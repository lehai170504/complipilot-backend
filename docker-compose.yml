services:
  postgres:
    image: postgres:16-alpine
    container_name: complipilot-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-complipilot}
      POSTGRES_USER: ${POSTGRES_USER:-complipilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - complipilot_backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-complipilot} -d ${POSTGRES_DB:-complipilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: complipilot-backend-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-complipilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-complipilot_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - complipilot_backend_minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../complipilot-ai-service
      dockerfile: Dockerfile
    container_name: complipilot-ai-service
    restart: unless-stopped
    environment:
      APP_NAME: CompliPilot AI Service
      APP_ENV: local
      APP_VERSION: 0.1.0
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:8081
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      AI_FALLBACK_TO_RULES: ${AI_FALLBACK_TO_RULES:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  complipilot_backend_postgres_data:
  complipilot_backend_minio_data:


