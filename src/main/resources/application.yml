spring:
  application:
    name: complipilot-backend

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://localhost:5433/complipilot}"
    username: "${DATABASE_USERNAME:complipilot}"
    password: "${DATABASE_PASSWORD:123456}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${PORT:${API_PORT:8081}}"
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    enabled: "${SPRINGDOC_ENABLED:true}"
    path: /v3/api-docs
  swagger-ui:
    enabled: "${SPRINGDOC_ENABLED:true}"
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}"

  platform:
    admin-emails: "${APP_PLATFORM_ADMIN_EMAILS:}"

  jwt:
    secret: "${JWT_SECRET:local-dev-secret-key-change-this-in-production-please-123456}"
    issuer: "${JWT_ISSUER:complipilot-backend}"
    access-token-expiration-seconds: "${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}"
    refresh-token-expiration-seconds: "${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}"
    refresh-token-cleanup-fixed-rate-ms: "${JWT_REFRESH_TOKEN_CLEANUP_FIXED_RATE_MS:3600000}"
    revoked-refresh-token-retention-seconds: "${JWT_REVOKED_REFRESH_TOKEN_RETENTION_SECONDS:604800}"

  storage:
    provider: "${STORAGE_PROVIDER:minio}"

    endpoint: "${MINIO_ENDPOINT:http://localhost:9000}"
    access-key: "${MINIO_ACCESS_KEY:complipilot}"
    secret-key: "${MINIO_SECRET_KEY:complipilot_minio_password}"
    bucket: "${MINIO_BUCKET_EVIDENCE:complipilot-evidence}"
    public-endpoint: "${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}"
    presigned-url-expiration-minutes: "${MINIO_PRESIGNED_URL_EXPIRATION_MINUTES:15}"

    supabase:
      url: "${SUPABASE_URL:}"
      service-role-key: "${SUPABASE_SERVICE_ROLE_KEY:}"
      bucket: "${SUPABASE_STORAGE_BUCKET:complipilot-evidence-prod}"
      signed-url-expiration-seconds: "${SUPABASE_SIGNED_URL_EXPIRATION_SECONDS:900}"

  ai:
    base-url: "${AI_SERVICE_BASE_URL:http://localhost:8000}"

  rate-limit:
    enabled: "${RATE_LIMIT_ENABLED:true}"
    auth-capacity: "${RATE_LIMIT_AUTH_CAPACITY:20}"
    auth-window-seconds: "${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}"

  demo-users:
    enabled: "${APP_DEMO_USERS_ENABLED:false}"

  frontend:
    base-url: "${APP_FRONTEND_BASE_URL:http://localhost:3000}"

  mail:
    enabled: "${MAIL_ENABLED:false}"
    provider: "${MAIL_PROVIDER:resend}"
    from: "${MAIL_FROM:CompliPilot <onboarding@resend.dev>}"
    resend:
      api-key: "${RESEND_API_KEY:}"

info:
  app:
    name: CompliPilot Backend
    description: AI Compliance & Evidence OS backend API
    version: "${APP_VERSION:0.0.1-SNAPSHOT}"