spring:
  application:
    name: complipilot-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/complipilot
    username: complipilot
    password: "123456"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: "lehoanghai170504"
    issuer: "complipilot-backend"
    access-token-expiration-seconds: 3600

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha