spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: "${DATABASE_URL}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${API_PORT:8080}"
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    enabled: "${SPRINGDOC_ENABLED:false}"
  swagger-ui:
    enabled: "${SPRINGDOC_ENABLED:false}"

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS}"

  jwt:
    secret: "${JWT_SECRET}"
    issuer: "${JWT_ISSUER:complipilot-backend}"
    access-token-expiration-seconds: "${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}"
    refresh-token-expiration-seconds: "${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}"

  storage:
    endpoint: "${MINIO_ENDPOINT}"
    access-key: "${MINIO_ACCESS_KEY}"
    secret-key: "${MINIO_SECRET_KEY}"
    bucket: "${MINIO_BUCKET_EVIDENCE}"
    public-endpoint: "${MINIO_PUBLIC_ENDPOINT}"
    presigned-url-expiration-minutes: "${MINIO_PRESIGNED_URL_EXPIRATION_MINUTES:15}"

  rate-limit:
    enabled: "${RATE_LIMIT_ENABLED:true}"
    auth-capacity: "${RATE_LIMIT_AUTH_CAPACITY:10}"
    auth-window-seconds: "${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}"

info:
  app:
    name: CompliPilot Backend
    description: AI Compliance & Evidence OS backend API
    version: "${APP_VERSION:0.0.1-SNAPSHOT}"