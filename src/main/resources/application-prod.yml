spring:
  main:
    lazy-initialization: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  data:
    jpa:
      repositories:
        bootstrap-mode: lazy

  datasource:
    url: "${DATABASE_URL}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 30000
      max-lifetime: 600000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        boot:
          allow_jdbc_metadata_access: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${PORT:${API_PORT:8080}}"
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    enabled: "${SPRINGDOC_ENABLED:false}"
    path: /v3/api-docs
  swagger-ui:
    enabled: "${SPRINGDOC_ENABLED:false}"
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS}"

  jwt:
    secret: "${JWT_SECRET}"
    issuer: "${JWT_ISSUER:complipilot-backend}"
    access-token-expiration-seconds: "${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}"
    refresh-token-expiration-seconds: "${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}"
    refresh-token-cleanup-fixed-rate-ms: "${JWT_REFRESH_TOKEN_CLEANUP_FIXED_RATE_MS:3600000}"
    revoked-refresh-token-retention-seconds: "${JWT_REVOKED_REFRESH_TOKEN_RETENTION_SECONDS:604800}"

  storage:
    provider: "${STORAGE_PROVIDER:supabase}"

    endpoint: "${MINIO_ENDPOINT:}"
    access-key: "${MINIO_ACCESS_KEY:}"
    secret-key: "${MINIO_SECRET_KEY:}"
    bucket: "${MINIO_BUCKET_EVIDENCE:}"
    public-endpoint: "${MINIO_PUBLIC_ENDPOINT:}"
    presigned-url-expiration-minutes: "${MINIO_PRESIGNED_URL_EXPIRATION_MINUTES:15}"

    supabase:
      url: "${SUPABASE_URL}"
      service-role-key: "${SUPABASE_SERVICE_ROLE_KEY}"
      bucket: "${SUPABASE_STORAGE_BUCKET}"
      signed-url-expiration-seconds: "${SUPABASE_SIGNED_URL_EXPIRATION_SECONDS:900}"

  ai:
    base-url: "${AI_SERVICE_BASE_URL}"

  rate-limit:
    enabled: "${RATE_LIMIT_ENABLED:true}"
    auth-capacity: "${RATE_LIMIT_AUTH_CAPACITY:10}"
    auth-window-seconds: "${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}"

  demo-users:
    enabled: "${APP_DEMO_USERS_ENABLED:false}"

info:
  app:
    name: CompliPilot Backend
    description: AI Compliance & Evidence OS backend API
    version: "${APP_VERSION:0.0.1-SNAPSHOT}"