name: Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: local-ci-secret-key-change-this-please-1234567890
      JWT_ISSUER: complipilot-backend
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: 3600
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000

      MINIO_ENDPOINT: http://localhost:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: complipilot
      MINIO_SECRET_KEY: complipilot_minio_password
      MINIO_BUCKET_EVIDENCE: complipilot-evidence
      MINIO_PRESIGNED_URL_EXPIRATION_MINUTES: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw clean test

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t complipilot-backend:ci .